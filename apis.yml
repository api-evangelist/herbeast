description: Herbeast is a sustainable skin care and lifestyle brand based in China, backed by Lightspeed
  Venture Partners. The company explores the application of Chinese herbal essence to the skin, grounding
  its formulations in the concepts and technical principles of biomedicine. Founded and led by CEO Yisa
  He with Chief Scientist and co-founder Yanjing Bai, Herbeast operates as a consumer skin care and
  lifestyle products brand rather than an API-first technology provider. As of this enrichment pass it
  publishes no public developer portal, API documentation, or machine-readable API surface; its only
  observed web property (herbeast.com) resolves to a deactivated Shopify storefront. It is retained in
  the API Evangelist network as a Lightspeed portfolio identity record, not as an active API producer.
